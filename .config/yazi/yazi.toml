[opener]
open_pdf = [
 { run = 'zathura "$@"', desc = 'open_pdf' }
]
open_vid = [
 { run = 'mpv "$@"', desc = 'open' }
]

[open]
rules = [
 { mime = "application/pdf", use = "open_pdf" },
 { mime = "video/*", use = "open_vid" },
 { name = "*.pdf", use = "open_pdf" },
 { name = "*.{mkv,mp4,avi,mov,webm,flv,wmv,m4v,mpg,mpeg}", use = "open_vid" },
]
